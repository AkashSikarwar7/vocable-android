name: Build & Test Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          else
            # Forks don't get this secret; write a placeholder so the build and unit tests can run.
            echo "GOOGLE_SERVICES_JSON_B64 not set; using placeholder google-services.json"
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "vocable-placeholder",
              "storage_bucket": "vocable-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.willowtree.vocable" }
                },
                "api_key": [{ "current_key": "placeholder" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "com.willowtree.vocable.debug" }
                },
                "api_key": [{ "current_key": "placeholder" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        run: ./gradlew testDebug

      - name: Assemble
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  pre-release-upload:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/pre-release-upload.yml
    secrets: inherit